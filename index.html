    <style>
      /* Splash screen — shown immediately on load (before JS/CSS bundle),
         removed by main.jsx once the app has mounted + logo animation finishes.
         Lives here (not in index.css) so it paints before any bundle download. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash svg {
        display: block;
        width: 320px;
        max-width: 70vw;
      }
      #splash .st0 {
        fill: #005926;
        stroke: #005926;
        stroke-width: 0;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: splashDrawGreen 2.2s ease-in-out forwards;
      }
      #splash .st1 {
        fill: #ed1c24;
        stroke: #ed1c24;
        stroke-width: 0;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: splashDrawRed 2.2s ease-in-out forwards;
      }
      @keyframes splashDrawGreen {
        0% { stroke-width: 2.5; stroke-dashoffset: 1200; fill-opacity: 0; opacity: 0; }
        15% { opacity: 1; stroke-width: 2.5; fill-opacity: 0; stroke-dashoffset: 800; }
        50% { stroke-dashoffset: 0; fill-opacity: 0; stroke-width: 2.5; }
        75% { fill-opacity: 1; stroke-width: 0; }
        100% { fill-opacity: 1; stroke-width: 0; opacity: 1; }
      }
      @keyframes splashDrawRed {
        0% { stroke-width: 2.5; stroke-dashoffset: 1200; fill-opacity: 0; opacity: 0; }
        30% { opacity: 1; stroke-width: 2.5; fill-opacity: 0; stroke-dashoffset: 800; }
        65% { stroke-dashoffset: 0; fill-opacity: 0; stroke-width: 2.5; }
        90% { fill-opacity: 1; stroke-width: 0; }
        100% { fill-opacity: 1; stroke-width: 0; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .st0, #splash .st1 { animation: none; fill-opacity: 1; stroke-width: 0; opacity: 1; }
      }
    </style>
  </head>
