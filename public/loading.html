<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading…</title>
<style>
  :root{
    --bg: #ffffff;
    --base: #d9d9d9;
    --shine: #ececec;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .page{
    width: 100%;
    max-width: 1280px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 14px;
  }

  /* shimmer block */
  .sk{
    position: relative;
    overflow: hidden;
    background: var(--base);
    border-radius: 14px;
  }
  .sk::after{
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(
      90deg,
      transparent 0%,
      var(--shine) 50%,
      transparent 100%
    );
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer{
    100%{ transform: translateX(100%); }
  }

  /* top strip */
  .top-strip{ grid-column: 1 / -1; height: 20px; border-radius: 10px; }

  /* header row: logo + search + two icons */
  .header{
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 4px 0;
  }
  .logo{
    flex-shrink: 0;
    display: flex;
    align-items: center;
    height: 46px;
    user-select: none;
  }
  .logo svg{
    height: 100%;
    width: auto;
    display: block;
  }
  .search{ flex: 1; height: 46px; }
  .icon-round{ width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; }
  .icon-pill{ width: 140px; height: 46px; flex-shrink: 0; }

  /* secondary nav bar */
  .subnav{ grid-column: 1 / -1; height: 28px; border-radius: 10px; }

  /* main content */
  .hero{ grid-column: 1 / span 8; height: 460px; }
  .side{ grid-column: 9 / span 4; grid-row: 4 / span 2; height: 100%; }

  .thumb{ grid-column: span 2; height: 130px; }

  @media (max-width: 720px){
    .header{ flex-wrap: wrap; }
    .logo{ font-size: 24px; }
    .hero{ grid-column: 1 / -1; height: 260px; }
    .side{ grid-column: 1 / -1; grid-row: auto; height: 180px; }
    .thumb{ grid-column: span 3; height: 90px; }
  }
</style>
</head>
